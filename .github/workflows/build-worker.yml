name: Build DECIMER worker image
on:
  push:
    branches: [main]
    paths:
      - Dockerfile.worker
      - worker-requirements.txt
      - .github/workflows/build-worker.yml
      - .dockerignore
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ghcr.io/peterdatascientia/panchem-decimer-worker:latest
          # Import cache metadata from the previously published image.
          # Keep the old GHA cache as a migration fallback only.
          cache-from: |
            type=registry,ref=ghcr.io/peterdatascientia/panchem-decimer-worker:latest
            type=gha
          # Inline metadata is exported with the image: no second large
          # upload of the layers to the GitHub Actions cache service.
          cache-to: type=inline
