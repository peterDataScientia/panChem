name: DECIMER PDF extraction
on:
  push:
    branches: [main]
    paths:
      - 'jobs/**/paper.pdf'
  workflow_dispatch:
    inputs:
      pdf_path:
        description: "Path to uploaded PDF in repository (jobs/id/paper.pdf)"
        required: false
        type: string
      pdf_url:
        description: "Alternative public HTTPS PDF URL"
        required: false
        type: string
      pages:
        description: "Selected pages, e.g. 1,3,5-7"
        required: true
        default: "1"
        type: string
      job_id:
        description: "Unique panChem job ID"
        required: false
        default: "manual"
        type: string
permissions:
  contents: read
jobs:
  decimer:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: ghcr.io/peterdatascientia/panchem-decimer-worker:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Announce job started
        if: ${{ github.event_name == 'push' }}
        run: python progress_events.py starting
      - name: Restore DECIMER model cache
        id: model_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.data
          key: panchem-decimer-models-v1
      - name: Download DECIMER models with retries
        id: model_weights
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
          CUDA_VISIBLE_DEVICES: "-1"
        run: |
          python - <<'PY'
          import os
          import time
          from pathlib import Path
          import requests
          url = "https://zenodo.org/records/10663579/files/mask_rcnn_molecule.h5?download=1"
          output = Path.home() / ".data/DECIMER-Segmentation_model/mask_rcnn_molecule.h5"
          output.parent.mkdir(parents=True, exist_ok=True)
          if output.exists() and output.stat().st_size > 200_000_000:
              print("Segmentation weights restored from cache")
          else:
              output.unlink(missing_ok=True)
              for attempt in range(1, 7):
                  try:
                      print(f"Segmentation model download attempt {attempt}/6", flush=True)
                      with requests.get(url, stream=True, timeout=(25, 240)) as response:
                          response.raise_for_status()
                          with output.open("wb") as target:
                              for chunk in response.iter_content(1024 * 1024):
                                  if chunk: target.write(chunk)
                      if output.stat().st_size < 200_000_000:
                          raise RuntimeError("Download appears incomplete")
                      print(f"Model downloaded: {output.stat().st_size} bytes")
                      break
                  except Exception as exc:
                      print(f"Download attempt failed: {exc}", flush=True)
                      output.unlink(missing_ok=True)
                      if attempt == 6: raise
                      time.sleep(min(attempt * 10, 40))
          PY
      - name: Save DECIMER model cache immediately
        if: success() && steps.model_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.data
          key: panchem-decimer-models-v1
      - name: Verify versions
        run: |
          python -c "import numpy, tensorflow, cv2; print('NumPy',numpy.__version__,'TF',tensorflow.__version__,'OpenCV',cv2.__version__)"
      - name: Extract selected pages
        env:
          PDF_PATH: ${{ inputs.pdf_path }}
          PDF_URL: ${{ inputs.pdf_url }}
          PDF_PAGES: ${{ inputs.pages }}
          TF_CPP_MIN_LOG_LEVEL: "2"
          CUDA_VISIBLE_DEVICES: "-1"
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          msg = (event.get("head_commit") or {}).get("message", "").strip()
          match = re.fullmatch(r"panChem PDF job ([0-9a-f]{12}) pages=([0-9,-]+)", msg)
          if not match:
              raise SystemExit(f"Unexpected push commit message: {msg!r}")
          pdf_path = Path("jobs") / match.group(1) / "paper.pdf"
          if not pdf_path.is_file():
              raise SystemExit(f"Uploaded PDF missing: {pdf_path}")
          print(f"Processing uploaded PDF: {pdf_path} | pages={match.group(2)}", flush=True)
          environment = os.environ.copy()
          environment["PANCHEM_PROGRESS_TOPIC"] = "panchem-" + match.group(1)
          subprocess.check_call(["python", "worker.py", "--file", str(pdf_path),
                                 "--pages", match.group(2), "--output", "results"], env=environment)
          PY
          elif [ -n "$PDF_PATH" ]; then
            python worker.py --file "$PDF_PATH" --pages "$PDF_PAGES" --output results
          else
            python worker.py --url "$PDF_URL" --pages "$PDF_PAGES" --output results
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panChem-extraction-${{ github.run_id }}
          path: |
            results/results.csv
            results/results.smi
            results/performance.json
            results/page_*_structure_*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Notify results available
        if: ${{ success() && github.event_name == 'push' }}
        run: python progress_events.py results_ready
      - name: Notify job failed
        if: ${{ failure() && github.event_name == 'push' }}
        run: python progress_events.py failed
