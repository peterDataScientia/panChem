name: DECIMER PDF extraction
on:
  workflow_dispatch:
    inputs:
      pdf_path:
        description: "Path to uploaded PDF in repository (jobs/id/paper.pdf)"
        required: false
        type: string
      pdf_url:
        description: "Alternative public HTTPS PDF URL"
        required: false
        type: string
      pages:
        description: "Selected pages, e.g. 1,3,5-7"
        required: true
        default: "1"
        type: string
      job_id:
        description: "Unique panChem job ID"
        required: false
        default: "manual"
        type: string
permissions:
  contents: read
jobs:
  decimer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: worker-requirements.txt
      - name: Install platform libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install DECIMER and dependencies
        run: python -m pip install -r worker-requirements.txt
      - name: Verify versions
        run: |
          python -c "import numpy, tensorflow, cv2; print('NumPy',numpy.__version__,'TF',tensorflow.__version__,'OpenCV',cv2.__version__)"
      - name: Extract selected pages
        env:
          PDF_PATH: ${{ inputs.pdf_path }}
          PDF_URL: ${{ inputs.pdf_url }}
          PDF_PAGES: ${{ inputs.pages }}
          TF_CPP_MIN_LOG_LEVEL: "2"
          CUDA_VISIBLE_DEVICES: "-1"
        run: |
          if [ -n "$PDF_PATH" ]; then
            python worker.py --file "$PDF_PATH" --pages "$PDF_PAGES" --output results
          else
            python worker.py --url "$PDF_URL" --pages "$PDF_PAGES" --output results
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panChem-extraction-${{ github.run_id }}
          path: |
            results/results.csv
            results/results.smi
            results/page_*_structure_*.png
          retention-days: 7
          if-no-files-found: warn
