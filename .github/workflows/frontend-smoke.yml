name: Streamlit 2D drawing smoke test
on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'chemqa.py'
      - 'requirements.txt'
      - 'packages.txt'
      - 'tests/smoke_2d.py'
      - '.github/workflows/frontend-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install native drawing libraries
        run: sudo apt-get update && sudo xargs -a packages.txt apt-get install -y
      - name: Install frontend dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py chemqa.py tests/smoke_2d.py
      - name: Verify native and fallback molecular 2D drawing
        run: PYTHONPATH=. python tests/smoke_2d.py
