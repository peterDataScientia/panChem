name: Streamlit frontend smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'scaffold_builder.py'
      - 'auto_compounds.py'
      - 'markush_pipeline.py'
      - 'source_pdf.py'
      - 'tests/smoke_source_pdf.py'
      - 'tests/smoke_markush_pipeline.py'
      - 'tests/smoke_auto_compounds.py'
      - 'pages/1_Scaffold_R_Group_Builder.py'
      - 'tests/smoke_scaffold_builder.py'
      - 'ketcher_review.py'
      - 'tests/smoke_ketcher.py'
      - 'time_utils.py'
      - 'tests/smoke_time_eat.py'
      - 'chemqa.py'
      - 'pdf_viewer.py'
      - 'progress_events.py'
      - 'performance_diagnostics.py'
      - 'worker.py'
      - 'tests/smoke_performance.py'
      - 'components/live_progress/index.html'
      - 'tests/smoke_realtime.py'
      - 'tests/smoke_pdf_viewer.py'
      - 'requirements.txt'
      - 'packages.txt'
      - 'tests/smoke_2d.py'
      - '.github/workflows/frontend-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install native drawing libraries
        run: sudo apt-get update && sudo xargs -a packages.txt apt-get install -y
      - name: Install frontend dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q source_pdf.py tests/smoke_source_pdf.py markush_pipeline.py tests/smoke_markush_pipeline.py auto_compounds.py tests/smoke_auto_compounds.py scaffold_builder.py pages/1_Scaffold_R_Group_Builder.py tests/smoke_scaffold_builder.py ketcher_review.py app.py time_utils.py chemqa.py pdf_viewer.py progress_events.py tests/smoke_2d.py tests/smoke_pdf_viewer.py tests/smoke_realtime.py tests/smoke_time_eat.py performance_diagnostics.py worker.py tests/smoke_performance.py
      - name: Verify source-PDF artifact and historical run recovery
        run: PYTHONPATH=. python tests/smoke_source_pdf.py
      - name: Verify PDF SAR table and Markush assembly
        run: PYTHONPATH=. python tests/smoke_markush_pipeline.py
      - name: Verify automatic DECIMER compound extraction
        run: PYTHONPATH=. python tests/smoke_auto_compounds.py
      - name: Verify scaffold assembly, error handling and exports
        run: PYTHONPATH=. python tests/smoke_scaffold_builder.py
      - name: Verify native and fallback molecular 2D drawing
        run: PYTHONPATH=. python tests/smoke_2d.py
      - name: Verify fullscreen PDF control HTML and JavaScript
        run: PYTHONPATH=. python tests/smoke_pdf_viewer.py
      - name: Verify Ketcher save and chemical export
        run: PYTHONPATH=. python tests/smoke_ketcher.py
      - name: Verify real-time SSE event bridge
        run: PYTHONPATH=. python tests/smoke_realtime.py
      - name: Verify East Africa Time labels
        run: PYTHONPATH=. python tests/smoke_time_eat.py
      - name: Verify DECIMER worker timing and GitHub diagnostics
        run: PYTHONPATH=. python tests/smoke_performance.py
