name: Streamlit frontend smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'ketcher_review.py'
      - 'tests/smoke_ketcher.py'
      - 'time_utils.py'
      - 'tests/smoke_time_eat.py'
      - 'chemqa.py'
      - 'pdf_viewer.py'
      - 'progress_events.py'
      - 'components/live_progress/index.html'
      - 'tests/smoke_realtime.py'
      - 'tests/smoke_pdf_viewer.py'
      - 'requirements.txt'
      - 'packages.txt'
      - 'tests/smoke_2d.py'
      - '.github/workflows/frontend-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install native drawing libraries
        run: sudo apt-get update && sudo xargs -a packages.txt apt-get install -y
      - name: Install frontend dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q ketcher_review.py app.py time_utils.py chemqa.py pdf_viewer.py progress_events.py tests/smoke_2d.py tests/smoke_pdf_viewer.py tests/smoke_realtime.py tests/smoke_time_eat.py
      - name: Verify native and fallback molecular 2D drawing
        run: PYTHONPATH=. python tests/smoke_2d.py
      - name: Verify fullscreen PDF control HTML and JavaScript
        run: PYTHONPATH=. python tests/smoke_pdf_viewer.py
      - name: Verify Ketcher save and chemical export
        run: PYTHONPATH=. python tests/smoke_ketcher.py
      - name: Verify real-time SSE event bridge
        run: PYTHONPATH=. python tests/smoke_realtime.py
      - name: Verify East Africa Time labels
        run: PYTHONPATH=. python tests/smoke_time_eat.py
